{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ALLOS</title>
  <link rel="icon" href="{% static 'images/Icone_Allos_Verde.png' %}" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page:#0F1419;--bg-card:#151C24;--bg-card-elevated:#1A2332;
      --bg-input:#121920;--bg-hover:#1E2A38;
      --border-subtle:rgba(255,255,255,.06);--border-default:rgba(255,255,255,.09);
      --border-strong:rgba(255,255,255,.14);
      --text-primary:#E8ECF0;--text-secondary:#8A9AAC;--text-tertiary:#5A6B7A;
      --teal-400:#5BB8AE;--teal-500:#2E9E8F;--teal-glow:rgba(46,158,143,.15);
      --red-bg:rgba(239,68,68,.12);--red-border:rgba(239,68,68,.25);--red-text:#EF4444;
      --shadow-card:0 2px 8px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.2);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--bg-page); color:var(--text-primary);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      overflow:hidden; position:relative;
    }

    /* Starfield canvas */
    #starfield { position:fixed; inset:0; pointer-events:none; z-index:0; }

    /* Pattern overlay */
    .pattern-overlay {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background-image:url('/static/images/Padronagem_Icones_Branca.png');
      background-repeat:repeat; background-size:280px;
      opacity:.025;
    }

    /* Login card */
    @keyframes fadeInUp { from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)} }

    .login-card {
      width:100%; max-width:420px; margin:24px 16px;
      background:var(--bg-card); border:1px solid var(--border-default);
      border-radius:16px; box-shadow:var(--shadow-card);
      padding:40px 32px 32px; position:relative; z-index:2;
      animation:fadeInUp 600ms ease-out;
      transition:border-color 300ms, box-shadow 300ms, transform 300ms;
    }
    .login-card:hover {
      border-color:rgba(46,158,143,.2);
      box-shadow:var(--shadow-card), 0 0 30px rgba(46,158,143,.06);
      transform:translateY(-2px);
    }

    .login-logo { text-align:center; margin-bottom:6px; animation:fadeInUp 600ms ease-out 100ms both; }
    .login-logo img { height:52px; width:auto; opacity:.85; }
    .login-brand {
      font-size:28px; font-weight:800; letter-spacing:.06em;
      color:var(--teal-400); text-align:center; margin-bottom:4px;
      animation:fadeInUp 600ms ease-out 100ms both;
    }
    .login-subtitle {
      text-align:center; color:var(--text-tertiary); font-size:14px;
      margin-bottom:32px; animation:fadeInUp 600ms ease-out 100ms both;
    }
    .login-form { animation:fadeInUp 600ms ease-out 200ms both; }

    /* Form elements */
    .form-group { margin-bottom:20px; }
    .form-group:last-of-type { margin-bottom:24px; }
    .form-label {
      display:block; font-weight:500; font-size:14px;
      color:var(--text-secondary); margin-bottom:6px;
    }
    .input-wrap { position:relative; }
    .input-wrap input {
      width:100%; background:var(--bg-input); border:1.5px solid var(--border-strong);
      border-radius:12px; padding:11px 14px 11px 42px; font-size:14px;
      color:var(--text-primary); font-family:inherit; transition:all 200ms; outline:none;
    }
    .input-wrap input::placeholder { color:var(--text-tertiary); }
    .input-wrap input:focus {
      border-color:var(--teal-500);
      box-shadow:0 0 0 3px var(--teal-glow);
      background:var(--bg-card);
    }
    .input-wrap .icon {
      position:absolute; left:14px; top:50%; transform:translateY(-50%);
      color:var(--text-tertiary); font-size:16px; pointer-events:none;
      transition:color 200ms;
    }
    .input-wrap input:focus ~ .icon { color:var(--teal-400); }

    /* Button */
    .btn-login {
      width:100%; padding:12px; font-size:15px; font-weight:700;
      color:#fff; border:none; border-radius:12px; cursor:pointer;
      background:linear-gradient(135deg,var(--teal-500),#3AAFA0);
      box-shadow:0 2px 8px rgba(46,158,143,.3);
      transition:all 200ms; font-family:inherit;
    }
    .btn-login:hover {
      box-shadow:0 4px 14px rgba(46,158,143,.4);
      transform:translateY(-1px);
    }
    .btn-login:active { transform:translateY(0); }

    /* Error */
    .login-error {
      background:var(--red-bg); border:1px solid var(--red-border);
      color:var(--red-text); border-radius:12px; padding:12px 16px;
      font-size:13px; margin-top:20px;
      animation:fadeInUp 400ms ease-out 300ms both;
    }
    .login-error ul { margin:0; padding-left:16px; }
    .login-error li { margin:2px 0; }

    @media(max-width:480px) {
      .login-card { padding:32px 20px 24px; }
    }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="pattern-overlay"></div>

  <div class="login-card">
    <div class="login-logo">
      <img src="{% static 'images/Icone_Allos_Verde.png' %}" alt="Allos">
    </div>
    <div class="login-brand">ALLOS</div>
    <div class="login-subtitle">Acesse sua conta</div>

    <form method="post" class="login-form">
      {% csrf_token %}
      <div class="form-group">
        <label for="username" class="form-label">Usuário</label>
        <div class="input-wrap">
          <input type="text" id="username" name="username" placeholder="Seu usuário" required>
          <i class="bi bi-person icon"></i>
        </div>
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Senha</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="Sua senha" required>
          <i class="bi bi-lock icon"></i>
        </div>
      </div>
      <button type="submit" class="btn-login">Entrar</button>
    </form>

    {% if form.errors %}
    <div class="login-error">
      <ul>
        {% for field in form %}
          {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
        {% endfor %}
        {% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}
      </ul>
    </div>
    {% endif %}
  </div>

  <script>
  (function(){
    var canvas=document.getElementById('starfield');
    if(!canvas)return;
    var ctx=canvas.getContext('2d');var stars=[];
    function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
    function create(){
      stars=[];
      for(var i=0;i<70;i++)stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.1+.3,a:Math.random()*.4+.2,sp:Math.random()*.12+.02,ts:Math.random()*.008+.002,to:Math.random()*Math.PI*2,c:'255,255,255'});
      for(var i=0;i<10;i++)stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.6+.8,a:Math.random()*.35+.25,sp:Math.random()*.08+.01,ts:Math.random()*.005+.002,to:Math.random()*Math.PI*2,c:'46,158,143'});
    }
    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      var t=Date.now()*.001;
      stars.forEach(function(s){
        var tw=Math.sin(t*s.ts*10+s.to)*.3+.7;var al=s.a*tw;
        ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba('+s.c+','+al+')';ctx.fill();
        if(s.c==='46,158,143'){ctx.beginPath();ctx.arc(s.x,s.y,s.r*3,0,Math.PI*2);ctx.fillStyle='rgba(46,158,143,'+(al*.12)+')';ctx.fill()}
        s.y-=s.sp;if(s.y<-5){s.y=canvas.height+5;s.x=Math.random()*canvas.width}
      });
      requestAnimationFrame(draw);
    }
    resize();create();draw();
    window.addEventListener('resize',function(){resize();create()});
  })();
  </script>
</body>
</html>
