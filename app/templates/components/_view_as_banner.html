{% if view_as_active %}
<div class="view-as-banner">
  <span><i class="fas fa-eye"></i>
    Modo supervisão — vendo dados de
    <strong>{{ view_as_terapeuta.fk_associado.nome }}</strong>
    (somente leitura)
  </span>
  <form method="post" action="{% url 'supervisao_voltar' %}" style="display:inline;margin:0">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.path }}">
    <button type="submit" class="view-as-btn-voltar">
      <i class="fas fa-arrow-left"></i> Voltar à minha visualização
    </button>
  </form>
</div>
<style>
  .view-as-banner {
    position: fixed; top: 56px; left: 0; right: 0; z-index: 1029;
    background: linear-gradient(90deg, #f59e0b, #ef4444);
    color: #fff; padding: 8px 16px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .view-as-banner i { margin-right: 6px; }
  .view-as-btn-voltar {
    background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4);
    color: #fff; padding: 4px 12px; border-radius: 6px; cursor: pointer;
    font-size: 12px; font-weight: 600;
  }
  .view-as-btn-voltar:hover { background: rgba(255,255,255,.3); }
  body { padding-top: 92px !important; }
  .sidebar-custom, .sidebar { top: 92px !important; }
  @media (max-width: 768px) {
    .view-as-banner { font-size: 11px; padding: 6px 10px; gap: 8px; }
    .view-as-btn-voltar { padding: 3px 8px; font-size: 11px; }
    body { padding-top: 100px !important; }
  }
</style>
{% endif %}
